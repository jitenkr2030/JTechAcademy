{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Login — JTech LMS{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-1">Welcome Back</h2>
                    <p class="text-muted">Login to continue learning.</p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button class="btn btn-primary w-100 mt-2" type="submit">
                            <i class="bi bi-box-arrow-in-right"></i> Login
                        </button>
                    </form>
                    <p class="text-center text-muted small mt-3 mb-0">
                        Don't have an account? <a href="{% url 'register' %}">Sign up free</a>
                    </p>
                    <p class="text-center text-muted small mt-1 mb-0">
                        Are you an instructor? <a href="{% url 'register_instructor' %}">Apply here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
